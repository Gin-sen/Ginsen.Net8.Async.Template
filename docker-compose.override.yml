services:
  ginsen.net8.async.milestone.api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      # - ASPNETCORE_HTTP_PORTS=8080
    ports:
      - "8082:8080"

  ginsen.net8.async.milestone.worker:
    environment:
      - DOTNET_ENVIRONMENT=Docker
    # ports:
    #   - "8081:8080"

  rabbit:
    labels:
      NAME: "rabbit"
    hostname: 'rabbit'
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=user
      - RABBITMQ_DEFAULT_PASS=password
      - RABBITMQ_DEFAULT_VHOST=my_vhost
    volumes:
      - rabbit-data:/var/lib/rabbitmq/mnesia/
      - ./compose/rabbit/conf/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      # - ./compose/rabbit/conf/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      # - ./compose/rabbit/definitions.d/:/etc/rabbitmq/definitions.d/:ro
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 15s
      retries: 5

  postgres:
    environment:
      - PGUSER=postgres
      - POSTGRES_DB=mypostgresdb
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5

  azurite:
    hostname: azurite
    restart: always
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - azurite-data:/workspace
volumes:
  rabbit-data: {}
  postgres-data: {}
  azurite-data: {}