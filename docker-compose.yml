services:
  ginsen-net8-async-milestone-api:
    image: ${CONTAINER_REGISTRY-ghcr.io/gin-sen/}ginsen-net8-async-milestone-api:dev
    build:
      context: .
      dockerfile: Dockerfile
      target: final-api
      args:
        - BUILD_CONFIGURATION=${BUILD_CONFIGURATION-Debug}
      # dockerfile: ginsen-net8-async-milestone-Api/Dockerfile
    networks:
      - backend-net


  ginsen-net8-async-milestone-worker:
    image: ${CONTAINER_REGISTRY-ghcr.io/gin-sen/}ginsen-net8-async-milestone-worker:dev
    build:
      context: .
      dockerfile: Dockerfile
      target: final-worker
      args:
        - BUILD_CONFIGURATION=${BUILD_CONFIGURATION-Debug}
      # dockerfile: ginsen-net8-async-milestone-Worker/Dockerfile
    networks:
      - backend-net

  ginsen-net8-async-milestone-backoffice:
    image: ${CONTAINER_REGISTRY-ghcr.io/gin-sen/}ginsen-net8-async-milestone-backoffice:dev
    build:
      context: .
      dockerfile: Dockerfile
      target: final-backoffice
      args:
        - BUILD_CONFIGURATION=${BUILD_CONFIGURATION-Debug}
      # dockerfile: ginsen-net8-async-milestone-BlazorBackOffice/Dockerfile
    networks:
      - backend-net
  ginsen-net8-async-milestone-backoffice-client:
    image: ${CONTAINER_REGISTRY-ghcr.io/gin-sen/}ginsen-net8-async-milestone-backoffice-client:dev
    build:
      context: .
      dockerfile: Dockerfile
      target: final-backoffice-client
      args:
        - BUILD_CONFIGURATION=${BUILD_CONFIGURATION-Debug}
      # dockerfile: ginsen-net8-async-milestone-BlazorBackOffice.Client/Dockerfile
    networks:
      - backend-net
      
  rabbit:
    image: rabbitmq:4-management
    networks:
      - backend-net


  postgres:
    image: postgres
    networks:
      - backend-net

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    networks:
      - backend-net
      
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.88.0
    networks:
      - backend-net

  jaeger:
    image: jaegertracing/all-in-one:1.50.0
    networks:
      - backend-net

  prometheus:
    image: prom/prometheus:v2.42.0
    depends_on:
    - cadvisor
    networks:
      - backend-net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    ports:
    - 8090:8080
    volumes:
    - /:/rootfs:ro
    - /var/run:/var/run:rw
    - /sys:/sys:ro
    - /var/lib/docker/:/var/lib/docker:ro
    depends_on:
    - redis
    networks:
      - backend-net
  redis:
    image: redis:latest
    container_name: redis
    ports:
    - 6379:6379
    networks:
      - backend-net
  loki:
    image: grafana/loki:2.7.4
    networks:
      - backend-net

  promtail:
    image: grafana/promtail:latest
    networks:
      - backend-net

  grafana:
    image: grafana/grafana:9.4.3
    networks:
      - backend-net

  monitor-api:
    image: mcr.microsoft.com/dotnet/monitor:8
    networks:
      - backend-net
  monitor-worker:
    image: mcr.microsoft.com/dotnet/monitor:8
    networks:
      - backend-net
  monitor-backoffice:
    image: mcr.microsoft.com/dotnet/monitor:8
    networks:
      - backend-net

networks:
  backend-net:
    driver: bridge