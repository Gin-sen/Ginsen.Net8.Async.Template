global:
  evaluation_interval: 30s
  scrape_interval: 5s
scrape_configs:
- job_name: docker
  static_configs:
    - targets: ["host.docker.internal:9323"]
- job_name: cadvisor
  scrape_interval: 5s
  static_configs:
  - targets:
    - cadvisor:8080
- job_name: otel
  static_configs:
  - targets:
    - 'otel-collector:8889'
- job_name: otel-collector
  static_configs:
  - targets:
    - 'otel-collector:8888'
- job_name: dotnet-monitor-api
  static_configs:
  - targets:
    - 'monitor-api:52325'
- job_name: dotnet-monitor-worker
  static_configs:
  - targets:
    - 'monitor-worker:52325'
- job_name: dotnet-monitor-backoffice
  static_configs:
  - targets:
    - 'monitor-backoffice:52325'